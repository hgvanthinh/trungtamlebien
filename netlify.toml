# Netlify configuration for SPA routing
[build]
  # Build command
  command = "npm run build"
  # Output directory
  publish = "dist"

# Redirect all routes to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# index.html must always be revalidated so users get the latest asset references
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Hashed build assets can be cached forever since their filename changes on every build
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
